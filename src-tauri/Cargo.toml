[package]
name = "diet-diary"
version = "1.0.0"
description = "DietDiary - Personal Nutrition Tracker"
authors = ["JongYu"]
edition = "2021"

[lib]
name = "diet_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
